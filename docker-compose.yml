# Docker Compose for local development
# Veritabanı Firestore olduğu için sadece API servisi

version: '3.8'

services:
  # =============================================
  # Geliom API (NestJS)
  # =============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geliom-api
    restart: unless-stopped
    ports:
      - '3045:3045'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3045
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
    volumes:
      - ./geliom-8d06f-firebase-adminsdk-fbsvc-00dc3c2155.json:/app/firebase-service-account.json:ro
    networks: [ae-network]
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3045/api/auth/health']
      interval: 30s
      timeout: 3s
      retries: 3


networks:
  ae-network:
    external: true
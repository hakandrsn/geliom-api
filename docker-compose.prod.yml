# Docker Compose for Production (Render.com compatible)
# This file is for reference - Render.com uses Dockerfile directly

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geliom-api-prod
    restart: always
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-/app/firebase-service-account.json}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_API_KEY: ${ONESIGNAL_API_KEY:-}
      ADAPTY_WEBHOOK_SECRET: ${ADAPTY_WEBHOOK_SECRET:-}
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/auth/health']
      interval: 30s
      timeout: 3s
